name: Test build
# Keep unit tests and follow them with an isolated keyboard test on a local emulator.

on:
# disabled on push: when I push to non-main, I do a PR anyway
#  push:
    # don't run on main. I noticed I often don't push commits to avoid unnecessary workflow runs
#    branches-ignore: [ main ]
#    paths:
#      - 'app/**'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/ime-smoke/**'
      - '*gradle*'
      - 'gradle/**'
      - '.github/workflows/build-test-auto.yml'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # Robolectric's API 36 sandbox requires Java 21; app bytecode stays Java 17.
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew testRunTestsUnitTest

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}

  ime-smoke:
    name: IME smoke (API 35)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v3

      - name: Install build SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'

      - name: Build isolated keyboard, editor, and instrumentation APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleSmoke :tools:ime-smoke:assembleDebug :tools:ime-smoke:assembleDebugAndroidTest -Pandroid.injected.build.abi=x86_64

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test actual keyboard input and settings on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python tools/ime-smoke/run.py --serial emulator-5554 --output build/ime-smoke-ci

      - name: Upload IME smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ime-smoke-api35
          path: build/ime-smoke-ci/
          if-no-files-found: warn
          retention-days: 7
